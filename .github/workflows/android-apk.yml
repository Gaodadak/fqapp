name: Android APK
on:
  push:
    branches: [master]
    # 打 tag 也出包：tag 推送不走 paths 过滤（native-crypto 在
    # v1.0.117 tag 推送时已跑过一次可作证），branches/tags 是 OR 关系，
    # 所以加 tags 后推 v* 就会触发一次完整构建，APK 在 Artifacts 里，
    # 不用建 Release 也能拿到安装包。
    tags: ['v*']
    paths:
      - 'lib/**'
      - 'android/**'
      - 'native/**'
      - 'rust/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'test/**'
      - 'flutter_rust_bridge.yaml'
      - 'scripts/build_rust_backend.sh'
      - 'scripts/build_rust_backend.ps1'
      - 'scripts/run_rust_host_tests.sh'
      - 'scripts/run_rust_host_tests.ps1'
      - 'scripts/check_native_alignment.cjs'
      - 'scripts/generate_app_icons.py'
      - 'scripts/verify_android_apk.py'
      - 'scripts/verify_audio_cenc.cjs'
      - '.github/workflows/android-apk.yml'
      - '.cargo/config.toml'
  pull_request:
    # Fork PRs receive no signing secrets, so the signing step degrades to an
    # unsigned build instead of failing; the same paths filter keeps
    # unrelated PRs from running the full build.
    paths:
      - 'lib/**'
      - 'android/**'
      - 'native/**'
      - 'rust/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'test/**'
      - 'flutter_rust_bridge.yaml'
      - 'scripts/build_rust_backend.sh'
      - 'scripts/build_rust_backend.ps1'
      - 'scripts/run_rust_host_tests.sh'
      - 'scripts/run_rust_host_tests.ps1'
      - 'scripts/check_native_alignment.cjs'
      - 'scripts/generate_app_icons.py'
      - 'scripts/verify_android_apk.py'
      - 'scripts/verify_audio_cenc.cjs'
      - '.github/workflows/android-apk.yml'
      - '.cargo/config.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_VERSION: '3.44.6'
  # Pinned flutter_rust_bridge toolchain. The Rust crate, the generated bindings
  # and the codegen binary must all be the same version.
  FRB_VERSION: '2.13.0'
  NDK_VERSION: '28.2.13676358'
  CMAKE_VERSION: '3.22.1'
  BUILD_TOOLS_VERSION: '36.0.0'
  RUST_TARGET: 'aarch64-linux-android'
  # Certificate the release APK must carry. We skip release sign check for debug build
  RELEASE_SIGNER_SHA256: 'e8471cd8a935fd71fd8197355b5558d245449d5bc8294f60f88616f60451c550'
  FQAPP_USE_MAVEN_MIRRORS: 'false'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m" -Dorg.gradle.workers.max=2 -Dorg.gradle.daemon=false'
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: always
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - name: Check out app source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: app
          persist-credentials: false
      - name: Compute artifact identifiers
        id: artifact-ids
        run: |
          # Placed right after checkout so the failure-diagnostics upload can
          # use the same identifiers even when the build fails early.
          # Artifact names reject '/', which a PR ref (123/merge) contains,
          # so sanitize the ref. run_number stays so re‑runs never collide.
          printf 'safe_ref=%s\n' "${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
          printf 'short_sha=%s\n' "${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Validate version tag
        if: github.ref_type == 'tag'
        run: |
          # A version tag must be a plain semver triple (v1.2.3): the APK's
          # versionName is compared against the tag below, and anything else
          # (v1.2, v1.2.3‑rc.1, a typo) would silently ship a mismatched build.
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version tag must match v<major>.<minor>.<patch> (got '$GITHUB_REF_NAME')" >&2
            exit 1
          fi
          printf 'Building version tag %s (expected versionName %s)\n' \
            "$GITHUB_REF_NAME" "${GITHUB_REF_NAME#v}"
      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-linux-android
          components: rustfmt, clippy
      - name: Cache the Cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: app/rust
      - name: Cache flutter_rust_bridge_codegen
        id: frb-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-codegen-${{ env.FRB_VERSION }}-${{ runner.os }}-${{ hashFiles('app/rust/Cargo.lock') }}
      - name: Install flutter_rust_bridge_codegen
        if: steps.frb-cache.outputs.cache‑hit != 'true'
        run: cargo install flutter_rust_bridge_codegen --version "$FRB_VERSION" --locked
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache‑dependency‑path: |
            app/android/**/*.gradle.kts
            app/android/gradle/wrapper/gradle‑wrapper.properties
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Android SDK components
        run: |
          sdkmanager_bin="$ANDROID_HOME/cmdline‑tools/latest/bin/sdkmanager"
          "$sdkmanager_bin" --licenses < <(yes) > /dev/null
          "$sdkmanager_bin" "platforms;android‑36" "build‑tools;$BUILD_TOOLS_VERSION" \
            "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"
          printf 'ANDROID_NDK_HOME=%s/ndk/%s\n' "$ANDROID_HOME" "$NDK_VERSION" >> "$GITHUB_ENV"
          flutter config --android‑sdk "$ANDROID_HOME" --no‑analytics
      - name: Check the Web assets, audio diagnostics, Rust build scripts, and .so freshness
        run: >-
          node --test test/web_assets_test.cjs
          test/verify_audio_cenc_test.cjs
          test/build_rust_backend_scripts_test.cjs
          test/check_so_freshness_test.cjs
      - name: Resolve Dart package dependencies
        run: flutter pub get --enforce‑lockfile
      - name: Rust formatting
        run: |
          mapfile -t sources < <(
            git ls‑files -- 'rust/**/*.rs' 'rust/*.rs' | grep -v 'frb_generated\.rs$'
          )
          if [ "${#sources[@]}" -eq 0 ]; then
            echo 'No hand‑written Rust sources found; refusing to pass an empty gate.' >&2
            exit 1
          fi
          printf 'Checking %d hand‑written Rust sources (generated bindings excluded).\n' \
            "${#sources[@]}"
          failed=0
          for source in "${sources[@]}"; do
            if ! rustfmt --check --edition 2021 --config skip_children=true "$source"; then
              printf 'Misformatted: %s\n' "$source" >&2
              failed=1
            fi
          done
          exit "$failed"
      - name: Rust lints
        run: cargo clippy --manifest‑path rust/Cargo.toml --locked --all‑targets -- -D warnings
      - name: Rust tests (signing, device crypto, protocol vectors)
        run: cargo test --manifest‑path rust/Cargo.toml --locked
      - name: Build the host Rust core for the FFI integration tests
        run: cargo build --manifest‑path rust/Cargo.toml
      - name: Host FFI integration tests (Dart -> FRB -> Rust, mock upstream)
        run: bash scripts/run_rust_host_tests.sh --skip‑build
      - name: Generate the bridge bindings and verify they are reproducible
        run: |
          mkdir -p build/ci‑artifacts
          digest() {
            find rust/src/frb_generated.rs lib/src/rust -type f -print0 \
              | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1
          }
          before="$(digest)"
          flutter_rust_bridge_codegen generate --config‑file flutter_rust_bridge.yaml
          after="$(digest)"
          printf 'generated bindings digest (before): %s\n' "$before"
          printf 'generated bindings digest (after):  %s\n' "$after"
          if [ "$before" != "$after" ]; then
            echo 'Generated bindings are stale: commit the output of flutter_rust_bridge_codegen.' >&2
            exit 1
          fi
          {
            printf 'bindings_sha256=%s\n' "$after"
          } > build/ci‑artifacts/bindings‑digest.txt
      - name: Compile the Rust core for Android ARM64
        run: bash scripts/build_rust_backend.sh --skip‑codegen
      - name: Check the Android Rust core library
        run: |
          mkdir -p build/ci‑artifacts
          so=android/app/src/main/jniLibs/arm64‑v8a/libfqapi_core.so
          test -s "$so"
          nm_bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux‑x86_64/bin/llvm‑nm"
          "$nm_bin" --dynamic --defined‑only "$so" > build/ci‑artifacts/rust‑core‑symbols.txt
          for symbol in frb_get_rust_content_hash store_dart_post_cobject; do
            if ! grep -Eq "[[:space:]]${symbol}$" build/ci‑artifacts/rust‑core‑symbols.txt; then
              echo "Missing Rust bridge symbol: $symbol" >&2
              exit 1
            fi
          done
          readelf_bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux‑x86_64/bin/llvm‑readelf"
          "$readelf_bin" -l "$so" > build/ci‑artifacts/rust‑core‑program‑headers.txt
          node scripts/check_native_alignment.cjs "$so"
      # ============ 跳过release签名恢复步骤，Debug包使用系统调试密钥 ============
      - name: Skip release signing for Debug build
        id: signing
        run: |
          printf 'has_release_signing=false\n' >> "$GITHUB_OUTPUT"
          echo "Debug build: using auto debug keystore, skip release keystore restore"
      - name: Check Flutter application
        run: |
          flutter analyze --no‑pub
          flutter test --no‑pub --concurrency=2 --reporter compact
      # ============ 修改这里：编译 debug ARM64 APK ============
      - name: Compile ARM64 Debug APK
        run: flutter build apk --debug --target‑platform android‑arm64 --no‑pub
      - name: Test Android runtime boundaries
        working‑directory: app/android
        run: ./gradlew :app:testDebugUnitTest --no‑daemon --max‑workers=2
      # ============ 校验APK，允许未正式签名（debug属于调试签名） ============
      - name: Verify APK contents and alignment
        env:
          HAS_RELEASE_SIGNING: ${{ steps.signing.outputs.has_release_signing }}
        run: |
          case "$HAS_RELEASE_SIGNING" in
            false)  signer_args=(--allow‑unsigned) ;;
            *)
              echo "::error::signing step wrong output '$HAS_RELEASE_SIGNING'" >&2
              exit 1
              ;;
          esac
          version_name="$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([^+]+).*/\1/')"
          highest_tag="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          if [ -n "$highest_tag" ] && [ -n "$version_name" ]; then
            highest_version="${highest_tag#v}"
            lowest="$(printf '%s\n%s\n' "$version_name" "$highest_version" | sort -V | head -1)"
            if [ "$lowest" = "$version_name" ] && [ "$version_name" != "$highest_version" ]; then
              echo "::warning::pubspec version $version_name lower than tag $highest_tag (skip error for debug)"
            fi
          fi
          version_args=()
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version_args=(--expected‑version‑name "${GITHUB_REF_NAME#v}")
          fi
          # Debug包输出路径：build/app/outputs/flutter‑apk/app‑debug.apk
          python3 scripts/verify_android_apk.py \
            --apk build/app/outputs/flutter‑apk/app‑debug.apk \
            --build‑tools "$ANDROID_HOME/build‑tools/$BUILD_TOOLS_VERSION" \
            "${signer_args[@]}" \
            "${version_args[@]}" \
            --report‑dir build/ci‑artifacts/verification
          cp build/app/outputs/flutter‑apk/app‑debug.apk build/ci‑artifacts/app‑debug.apk
          {
            printf 'App commit: %s\n' "$GITHUB_SHA"
            printf 'Rust core: fqapi_core (flutter_rust_bridge %s)\n' "$FRB_VERSION"
            printf 'Rust core library SHA‑256: '
            sha256sum android/app/src/main/jniLibs/arm64‑v8a/libfqapi_core.so
            printf 'Build type: DEBUG (auto debug keystore, can install directly)\n'
            printf 'NDK: %s\nCMake: %s\nAndroid Build Tools: %s\n' "$NDK_VERSION" "$CMAKE_VERSION" "$BUILD_TOOLS_VERSION"
            flutter --version
            cargo --version
            rustc --version
            java -version 2>&1
          } > build/ci‑artifacts/build‑info.txt
      - name: Upload Debug APK and verification reports
        id: artifact
        uses: actions/upload‑artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fqapp‑debug‑arm64‑${{ steps.artifact‑ids.outputs.safe_ref }}‑${{ steps.artifact‑ids.outputs.short_sha }}‑${{ github.run_number }}
          retention‑days: 14
          if‑no‑files‑found: error
          compression‑level: 0
          path: |
            app/build/ci‑artifacts/app‑debug.apk
            app/build/ci‑artifacts/build‑info.txt
            app/build/ci‑artifacts/rust‑core‑symbols.txt
            app/build/ci‑artifacts/rust‑core‑program‑headers.txt
            app/build/ci‑artifacts/verification/*.json
            app/build/ci‑artifacts/verification/*.sha256
            app/build/ci‑artifacts/verification/*.log
      - name: Retain diagnostics if a build or APK check fails
        if: failure()
        uses: actions/upload‑artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fqapp‑ap‑diagnostics‑${{ steps.artifact‑ids.outputs.safe_ref }}‑${{ steps.artifact‑ids.outputs.short_sha }}‑${{ github.run_number }}
          retention‑days: 7
          if‑no‑files‑found: ignore
          path: |
            app/build/ci‑artifacts/rust‑core‑symbols.txt
            app/build/ci‑artifacts/rust‑core‑program‑headers.txt
            app/build/ci‑artifacts/verification/*.json
            app/build/ci‑artifacts/verification/*.log
      - name: Write download summary
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact‑url }}
          HAS_RELEASE_SIGNING: ${{ steps.signing.outputs.has_release_signing }}
        run: |
          {
            printf '[下载 ARM64 DEBUG APK 和校验报告](%s)\n\n' "$ARTIFACT_URL"
            printf 'App commit: `%s`  \n' "$GITHUB_SHA"
            printf 'Rust core: `fqapi_core` (flutter_rust_bridge `%s`)\n\n' "$FRB_VERSION"
            printf 'Rust core library SHA‑256: `%s`\n\n' \
              "$(sha256sum android/app/src/main/jniLibs/arm64‑v8a/libfqapi_core.so | cut -d ' ' -f 1)"
            printf '构建类型：DEBUG调试包（系统默认调试签名，可以直接安装安卓设备）\n\n'
            printf '⚠️注意：Debug包不能覆盖安装原作者的正式签名Release包，安装前需要卸载旧版本。\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Dummy remove signing file
        if: always()
        run: echo "debug build skip keystore cleanup"
